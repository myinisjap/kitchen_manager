name: kitchen_manager

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    volumes:
      - ./data:/data
    restart: unless-stopped
    # Bound to loopback by default so the app (which has no auth of its own
    # unless OAUTH_ENABLED=true) isn't exposed to the LAN. The Traefik overlay
    # resets this and routes to it over proxy_net instead.
    ports:
      - "${KITCHEN_BIND_ADDR:-127.0.0.1}:8080:8080"

  splash:
    image: scrapinghub/splash
    restart: unless-stopped
